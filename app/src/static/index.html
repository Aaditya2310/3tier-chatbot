<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch · TriTier ChatOps</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#6b7280; --accent:#0f6fde; --me:#e8f1fd; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#e6e8eb; --muted:#9aa1ab; --accent:#4c9bf5; --me:#1d2a3b; --line:#2a2f37; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:720px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  h1 { font-size:20px; margin:0; }
  #meta { color:var(--muted); font-size:12px; }
  #log { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .msg { margin:0 0 12px; padding:10px 12px; border-radius:8px; max-width:85%; white-space:pre-wrap; }
  .user { background:var(--me); margin-left:auto; }
  .assistant { border:1px solid var(--line); }
  form { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font:inherit; }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; }
</style>
</head>
<body>
<main>
  <header><h1>Patch <small>· TriTier ChatOps</small></h1><span id="meta"></span></header>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <input id="q" placeholder="Ask about terraform, vpc, nat, rds…" autocomplete="off" required maxlength="2000">
    <button id="send">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById('log'), meta = document.getElementById('meta');
  let sid = null;
  try { sid = localStorage.getItem('sid'); } catch (_) {}

  function add(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }

  async function loadHistory() {
    if (!sid) return;
    const r = await fetch('/api/history/' + encodeURIComponent(sid));
    if (r.ok) (await r.json()).forEach(m => add(m.role, m.content));
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = document.getElementById('q'), btn = document.getElementById('send');
    const text = q.value.trim(); if (!text) return;
    add('user', text); q.value = ''; btn.disabled = true;
    try {
      const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message:text, session_id:sid }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      sid = data.session_id; try { localStorage.setItem('sid', sid); } catch (_) {}
      add('assistant', data.reply);
      // Shows which ASG instance answered — refresh a few times to watch the ALB balance.
      meta.textContent = 'served by ' + data.served_by + ' · ' + data.provider;
    } catch (err) { add('assistant', 'Error: ' + err.message); }
    finally { btn.disabled = false; q.focus(); }
  });

  loadHistory();
</script>
</body>
</html>
